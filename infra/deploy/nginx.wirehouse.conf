# This file is independent of all existing virtual hosts.
limit_req_zone $binary_remote_addr zone=wirehouse_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wirehouse.92.118.115.96.nip.io sklad-kontur.92.118.115.96.nip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/wirehouse/acme; }
    location / { return 301 https://sklad-kontur.92.118.115.96.nip.io$request_uri; }
}

# Keep the established API hostname for Telegram/VK callbacks. Every browser
# route leaves this old origin and clears its cached documents and assets.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wirehouse.92.118.115.96.nip.io;
    ssl_certificate /etc/letsencrypt/live/wirehouse.92.118.115.96.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wirehouse.92.118.115.96.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 140m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location = /api/integrations/telegram/webhook {
        proxy_pass http://127.0.0.1:18044;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /api/integrations/vk/webhook {
        proxy_pass http://127.0.0.1:18044;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location / {
        add_header Clear-Site-Data "\"cache\"" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 308 https://sklad-kontur.92.118.115.96.nip.io$request_uri;
    }
    access_log /var/log/nginx/wirehouse.access.log;
    error_log /var/log/nginx/wirehouse.error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sklad-kontur.92.118.115.96.nip.io;
    ssl_certificate /etc/letsencrypt/live/wirehouse.92.118.115.96.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wirehouse.92.118.115.96.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/wirehouse/current;
    index index.html;
    client_max_body_size 140m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    location /api/auth/ {
        limit_req zone=wirehouse_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18044;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18044;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /health { proxy_pass http://127.0.0.1:18044/health; }
    location /assets/ { try_files $uri =404; expires 30d; }
    location = /index.html { expires epoch; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
    access_log /var/log/nginx/wirehouse.access.log;
    error_log /var/log/nginx/wirehouse.error.log;
}
